<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<!-- viewport-fit=cover serve al notch; user-scalable=no toglie il doppio-tap
     zoom, che su un'app di disegno e' un incidente, non una funzione. -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Lavagna</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
  /* I font ufficiali del sito della Fondazione. I woff2 stanno accanto e NON
     sono nel repo, che e' pubblico: sono font commerciali di terzi (vedi
     .gitignore). Sull'originale manca l'header CORS, quindi non si possono
     linkare dal sito: vanno copiati same-origin. Dentro WordPress questo
     blocco non servira', li carica Elementor. */
  @font-face {
    font-family: 'SebinoSoft'; font-weight: 400; font-display: swap;
    src: url('font/SebinoSoft-Regular.woff2') format('woff2');
  }
  @font-face {
    font-family: 'SebinoSoft'; font-weight: 500; font-display: swap;
    src: url('font/SebinoSoft-Medium.woff2') format('woff2');
  }
  @font-face {
    font-family: 'SebinoSoft'; font-weight: 700; font-display: swap;
    src: url('font/SebinoSoft-Bold.woff2') format('woff2');
  }

  :root {
    --page:  #15171A;
    --board: #1F2225;
    --ink:   #C8CCD0;
    --dim:   #71777C;
    --off:   #565C61;
    --rule:  #2A2E32;

    /* Il gessetto e' l'unita' di misura della mensola: tutto il resto si
       allinea alla sua base e al suo centro. */
    --stick-w: 30px;
    --stick-h: 94px;
    --lift:    24px;
    --slot:    36px;
    --icon:    46px;
    /* I tre segni valgono 21 / 27 / 50 unita' di lavagna: qui si convertono
       in pixel una volta sola, cosi' il rapporto fra loro resta visibile. */
    --wscale:  0.43px;

    /* --- grammatica dei tasti, presa dal sito della Fondazione ---
       Un solo fondo e un solo bordo per tutti, raggio zero: sul sito non ci
       sono angoli arrotondati da nessuna parte. La gerarchia fra un tasto e
       l'altro non puo' quindi stare nel contenitore, e sta nel colore del
       testo: pieno per l'azione dichiarata, spento per la via laterale. */
    --btn-bg:     #FFFFFF1A;
    --btn-border: #FFFFFF54;
    /* Istituzionale. Vive SOLO dentro il tutorial (cliente, 18/09/2026): la
       mensola resta di gesso, vedi README. */
    --arancio:    #FF6000;
    --arancio-bordo: rgba(255, 96, 0, 0.5);

    /* I tre corpi del sito. Le soglie sono quelle di Elementor (1024 / 767),
       non i 700px con cui l'app cambia layout: i valori vengono da la'. A
       1440px il clamp da' 12,96px, che e' il corpo del pulsante DONA. */
    --btn-size: clamp(0.8rem, 0.9vw, 1rem);
  }

  @media (max-width: 1024px) { :root { --btn-size: 16px; } }
  @media (max-width: 767px)  { :root { --btn-size: 14px; } }

  @media (max-width: 700px) {
    :root {
      --stick-w: 22px;
      --stick-h: 64px;
      --lift:    18px;
      --slot:    34px;
      --icon:    44px;
      --wscale:  0.34px;
    }
  }

  /* La pagina non deve poter scorrere in nessun modo: e' il difetto numero
     uno di un canvas a tutto schermo su mobile. position:fixed lo garantisce
     anche dove overscroll-behavior non basta (iOS < 16). */
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    position: fixed;
    overflow: hidden;
    overscroll-behavior: none;
    background: var(--page);
  }

  body {
    color: var(--ink);
    font: 400 14px/1.4 'SebinoSoft', 'Atkinson Hyperlegible', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;          /* niente menu da long press */
    -webkit-tap-highlight-color: transparent;
  }

  .app {
    display: flex;
    flex-direction: column;
    height: 100dvh;
    padding:
      env(safe-area-inset-top) env(safe-area-inset-right)
      env(safe-area-inset-bottom) env(safe-area-inset-left);
    box-sizing: border-box;
  }

  #stage {
    flex: 1;
    min-height: 0;                        /* senza questo il flex non si stringe */
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* I due canvas sono sovrapposti: il tratto in corso sta sopra i tratti
     conclusi, e viene sostituito da quello definitivo quando si alza il dito. */
  /* Il colore della lavagna sta qui, non sul canvas: il cancellino lavora in
     destination-out e cancellerebbe anche il fondo se fosse dipinto insieme
     ai tratti. */
  .layers {
    position: relative;
    background: var(--board);
    overflow: hidden;
  }
  .layers canvas { display: block; }
  #overlay {
    position: absolute;
    inset: 0;
    /* Il pezzo piu' importante del file: senza, disegnare = scrollare. */
    touch-action: none;
    cursor: crosshair;
  }

  /* ---------- uscita ----------
     Sta nell'angolo piu' lontano dagli strumenti e porta un'etichetta: la
     sola freccia verrebbe letta come "annulla". */
  #btn-back {
    position: absolute;
    top: 6px;
    left: 6px;
    display: flex;
    align-items: center;
    gap: 8px;
    height: 44px;
    padding: 0 14px 0 10px;
    background: none;
    border: 0;
    color: var(--dim);
    font: inherit;
    font-size: 13px;
    cursor: pointer;
    touch-action: manipulation;
  }
  #btn-back:hover { color: var(--ink); }

  /* ---------- mensola ---------- */

  .ledge {
    display: grid;
    align-items: end;
    background: var(--page);
    grid-template-columns: auto auto 1fr auto auto;
    grid-template-areas: "widths tools . cmds save";
    column-gap: 26px;
    padding: 0 34px 22px;
  }

  @media (max-width: 700px) {
    .ledge {
      grid-template-columns: 1fr auto;
      grid-template-areas:
        "tools  tools"
        "widths cmds"
        "save   save";
      column-gap: 8px;
      row-gap: 6px;
      /* 16px ai lati, non 12: il riquadro del tutorial chiede 11,5px fuori
         dall'elemento (pad 6 + inset 4 + meta' tratto 1,5), e a 12 il
         tratteggio degli elementi a filo di schermo — gessetti, cancellino,
         cestino, SALVA — restava tagliato dal bordo e sembrava schiacciato.

         16 e non di piu': a 360px la mensola e' SATURA. Il suo min-content
         misura 326px, quindi oltre i 17px di padding il contenuto non si
         stringe, sfora — e il lato destro torna a filo come prima, peggio di
         com'era. Provato a 20px il 18/09/2026: .tools finiva a 346 invece di
         340. Chi volesse allargare ancora questi margini deve prima far
         scendere il min-content, non il padding. */
      padding: 6px 16px 16px;
    }
    /* Specificita' alzata di proposito: la regola base di .tools sta piu'
       in basso nel foglio e a parita' di peso vincerebbe lei. */
    .ledge .tools { gap: 10px; }
  }

  #widths { grid-area: widths; }
  .tools  { grid-area: tools; }
  .cmds   { grid-area: cmds; }

  /* Gessetti e cancellino sono lo stesso gruppo: se stanno in due colonne di
     griglia separate, la colonna dei comandi (piu' larga) strozza quella dei
     gessetti e su un telefono da 360px si riducono a 18px l'uno. */
  .tools {
    display: flex;
    align-items: flex-end;
    gap: 24px;
    min-width: 0;
  }
  #chalks { flex: 1 1 auto; }

  /* Su desktop lo spazio c'e': i gessetti tengono la larghezza nominale e
     restano staccati. Su telefono devono poter scendere sotto --slot, o a
     360px sforano. */
  @media (min-width: 701px) {
    .tools .chalk { flex: 0 0 var(--slot); }
  }
  #btn-save { grid-area: save; }

  /* ---------- gessetti ----------
     La selezione e' il gessetto sollevato. Nessun bordo, nessun anello,
     nessuna spunta: la posizione porta l'informazione. */

  #chalks { display: flex; align-items: flex-end; gap: 2px; min-width: 0; }

  .chalk, .eraser {
    -webkit-appearance: none;
    appearance: none;
    background: none;
    border: 0;
    padding: 0;
    margin: 0;
    font: inherit;
    cursor: pointer;
    touch-action: manipulation;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    height: calc(var(--stick-h) + var(--lift));
  }
  .chalk { flex: 1 1 var(--slot); min-width: 0; }
  .eraser { width: calc(var(--slot) * 1.7); --glow: #8A939944; }

  .stick, .felt {
    transition: transform .16s cubic-bezier(.2, .9, .3, 1), opacity .16s;
    opacity: 0.72;
  }
  .felt { opacity: 0.85; }
  .stick {
    width: var(--stick-w);
    height: var(--stick-h);
    border-radius: 7px 7px 3px 3px;
    background: var(--grad);
  }
  /* Il cancellino da lavagna, visto di fronte: blocco di legno sopra, feltro
     sotto. Il segno che lo rende riconoscibile non e' la forma — a questa
     dimensione un rettangolo bicolore non dice nulla — ma il feltro SPORCO DI
     GESSO: e' quello a dire che l'oggetto ha gia' cancellato qualcosa. */
  .felt {
    width: calc(var(--slot) * 1.55);
    height: calc(var(--stick-h) * 0.62);
    border-radius: 5px 5px 3px 3px;
    overflow: hidden;
    background: linear-gradient(96deg, #464D54 0%, #6E767D 45%, #4E555C 100%);
  }
  .felt::before {                         /* il dorso di legno: si impugna questo */
    content: '';
    display: block;
    height: 36%;
    background: linear-gradient(177deg, #7D6139 0%, #58431F 100%);
    border-bottom: 1px solid rgba(0, 0, 0, 0.6);
  }
  .felt::after {                          /* residui di gesso sul feltro */
    content: '';
    display: block;
    height: 64%;
    background: repeating-linear-gradient(95deg,
      transparent 0 3px,
      rgba(250, 248, 243, 0.42) 3px 5px,
      transparent 5px 10px);
  }

  [aria-pressed="true"] .stick,
  [aria-pressed="true"] .felt {
    opacity: 1;
    transform: translateY(calc(var(--lift) * -1));
    box-shadow: 0 14px 20px -12px rgba(0, 0, 0, 0.85), 0 0 26px -4px var(--glow);
  }
  /* Col cancellino in mano nessun gessetto e' alzato, ma restano tutti
     leggibili: non e' il momento di spegnere la palette. */
  .chalks-idle .stick { opacity: 1; }

  .chalk:focus-visible, .eraser:focus-visible,
  .cmd:focus-visible, #btn-back:focus-visible {
    outline: 2px solid var(--ink);
    outline-offset: 2px;
  }

  /* ---------- spessori ----------
     Tre segni di gesso nel colore corrente: colore e spessore si leggono
     insieme, non in due controlli separati. */

  #widths { display: flex; align-items: center; gap: 10px; }

  .wbtn {
    -webkit-appearance: none;
    appearance: none;
    background: none;
    border: 0;
    padding: 0;
    margin: 0;
    cursor: pointer;
    touch-action: manipulation;
    height: var(--stick-h);
    display: flex;
    align-items: center;
  }
  .wbtn i {
    display: block;
    width: 46px;
    background: var(--c);
    border-radius: 999px;
    opacity: 0.28;
    transition: opacity .16s, transform .16s;
  }
  @media (max-width: 700px) { .wbtn i { width: 30px; } }
  .wbtn[aria-pressed="true"] i { opacity: 1; transform: translateY(-6px); }

  /* ---------- comandi ----------
     Registro opposto agli strumenti: icone di linea, monocrome, piu' piccole. */

  .cmds { display: flex; align-items: center; justify-content: flex-end; height: var(--stick-h); }

  .cmd {
    -webkit-appearance: none;
    appearance: none;
    background: none;
    border: 0;
    padding: 0;
    margin: 0;
    width: var(--icon);
    height: var(--icon);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--ink);
    cursor: pointer;
    touch-action: manipulation;
    transition: color .14s;
  }
  .cmd:hover:not(:disabled) { color: #FAF8F3; }
  .cmd:disabled { color: #3C4247; cursor: default; }
  #btn-clear { color: var(--dim); margin-left: 16px; }
  /* Il "?" e' un comando, non uno strumento: stesso registro di annulla e
     cestino, ma la voce meno urgente della fila, e in testa per non finire
     accanto a SALVA. Niente fondo e niente bordo: darli anche a lui e alla
     fila accanto trasformerebbe la mensola in una griglia di scatole. */
  #btn-help { color: var(--off); margin-right: 16px; font-weight: 700; font-size: 19px; }
  #btn-help:hover { color: var(--ink); }

  /* ---------- i tasti ----------
     Un tasto e': fondo --btn-bg, bordo 2px --btn-border, raggio zero, icona
     sempre a destra del testo e dimensionata 1em, cosi' segue il corpo invece
     di avere una misura sua. Vale per SALVA e per i tasti del tutorial. */

  .btn {
    -webkit-appearance: none;
    appearance: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.6em;
    height: 46px;
    padding: 0 22px;
    background: var(--btn-bg);
    border: 2px solid var(--btn-border);
    border-radius: 0;
    font: inherit;
    /* 300 non esiste in SebinoSoft (400 / 500 / 700): il browser lo serve col
       Regular. E' il Regular che si vede, non un Light. */
    font-weight: 300;
    font-size: var(--btn-size);
    letter-spacing: 0.04em;
    color: var(--ink);
    cursor: pointer;
    touch-action: manipulation;
    transition: color .14s, border-color .14s, opacity .14s;
  }
  .btn svg { width: 1em; height: 1em; flex: 0 0 auto; }
  .btn.primario { color: #FAF8F3; }
  /* Il secondario non porta bordo: era l'unica differenza col primario, e due
     tasti identici affiancati si toccano per sbaglio. Trasparente e non
     rimosso, cosi' i due restano alti uguale e con il testo sulla stessa
     linea di base. */
  .btn.secondario { color: var(--dim); border-color: transparent; }
  .btn.secondario:hover { color: var(--ink); }
  .btn:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .btn:disabled { color: #3C4247; border-color: #FFFFFF14; cursor: default; }

  /* ---------- salva ----------
     Un tasto solo al posto di SCARICA + INVIA (17/09/2026): e' l'azione
     dichiarata della schermata. Oggi scarica e condivide; l'invio al backend
     si innestera' qui dentro, in Fase 6, senza cambiare la mensola.
     Si allinea al centro del gessetto, non al centro della riga, che e' piu'
     alta per via del sollevamento. */

  #btn-save {
    align-self: end;
    margin-bottom: calc((var(--stick-h) - 50px) / 2);
    height: 50px;
    padding: 0 26px;
  }

  @media (max-width: 700px) {
    /* Ultima riga tutta sua, a piena larghezza: l'azione e' dichiarata e non
       si puo' mancare. */
    #btn-save { height: 48px; margin: 4px 0 0; justify-self: stretch; }
  }

  /* ---------- tutorial ----------
     Il buco nel velo e' un solo elemento: il velo E' la sua ombra, estesa
     oltre lo schermo. Quattro div attorno all'area farebbero lo stesso con
     quattro volte il codice e una cucitura sugli angoli. */

  #tut { position: fixed; inset: 0; z-index: 50; }
  #tut[hidden] { display: none; }

  #spot {
    position: absolute;
    /* Velo forte piu' il cerchio di gesso: il velo porta l'attenzione, il
       tratteggio dice con che mano e' stato fatto e non introduce un
       linguaggio estraneo all'app. Senza un bordo sul buco, su fondo scuro il
       confine fra area in luce e velo non si vede. */
    box-shadow: 0 0 0 9999px rgba(8, 9, 11, 0.78);
    pointer-events: none;
    transition: left .34s cubic-bezier(.4, 0, .2, 1), top .34s cubic-bezier(.4, 0, .2, 1),
                width .34s cubic-bezier(.4, 0, .2, 1), height .34s cubic-bezier(.4, 0, .2, 1);
  }

  /* Il tratteggio e' un <rect> SVG e non piu' un outline, per una ragione
     sola: stroke-dashoffset si anima, outline-style no. Il tratto scorre
     lentamente lungo il perimetro — l'effetto "formiche in marcia" — e a un
     bambino dice che quella e' l'area viva.

     inset -4px e tratto centrato sul bordo: il tratteggio occupa da 2,5 a
     5,5px fuori dall'area, che e' dove stava l'outline di prima. Il totale
     che serve fuori dall'elemento evidenziato e' quindi pad(6) + 4 + 1,5 =
     11,5px: e' il numero che detta il margine laterale della mensola qui
     sopra, e i due vanno cambiati insieme. */
  /* width/height espliciti e non il solo `inset`: un <svg> e' un elemento
     rimpiazzato, e con le sole distanze dai bordi resta alla sua dimensione
     predefinita di 300x150 invece di stirarsi. Costato uno screenshot il
     18/09/2026: le misure di #spot erano giuste e il tratteggio stava per
     conto suo. */
  #spot-line {
    position: absolute;
    left: -4px;
    top: -4px;
    width: calc(100% + 8px);
    height: calc(100% + 8px);
    overflow: visible;
  }
  #spot-line rect {
    fill: none;
    stroke: var(--arancio);
    stroke-width: 3;
    stroke-dasharray: 13 9;
    animation: formiche 1.1s linear infinite;
  }
  /* -22 e' esattamente un ciclo del tratteggio (13 + 9): il giro si chiude
     senza scatto. Il verso e' orario, come si disegnerebbe a mano. */
  @keyframes formiche { to { stroke-dashoffset: -22; } }

  @media (prefers-reduced-motion: reduce) {
    #spot-line rect { animation: none; }
  }

  /* Nessun bordo: si stacca dal velo con la sola ombra. */
  #panel {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    width: min(430px, calc(100vw - 32px));
    box-sizing: border-box;
    padding: 22px 24px 18px;
    background: #272C31;
    box-shadow: 0 30px 70px -18px rgba(0, 0, 0, 0.92);
    transition: top .34s cubic-bezier(.4, 0, .2, 1);
  }

  /* L'importanza si dichiara con corpo e peso su fondo condiviso. "PASSO n DI
     7" e' anche l'unico indicatore di avanzamento: sette pallini sarebbero
     sette dispositivi grafici per quel che porta una riga di testo. */
  #step-n {
    margin: 0 0 10px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--arancio);
  }
  #step-t {
    margin: 0 0 20px;
    font-size: 19px;
    line-height: 1.34;
    color: #EDEFF1;
  }

  /* Allineati a sinistra, primario per primo: "HO CAPITO" si legge prima di
     "RIPETI". */
  #tut .row { display: flex; align-items: center; justify-content: flex-start; gap: 10px; }
  /* Serve davvero: .btn e' inline-flex, e un display esplicito vince sul
     display:none implicito dell'attributo hidden. Senza questa riga RIPETI
     si vede da tutti i passi. */
  .btn[hidden] { display: none; }

  /* ---------- i due tasti del tutorial, in arancione ----------
     Le regole portano l'id e non .primario / .secondario: SALVA condivide
     quelle classi, e l'arancione NON deve colare sulla mensola — dove nove
     gessetti portano gia' informazione col colore. Qui invece il velo li
     spegne tutti, e l'arancione resta l'unica cosa accesa dello schermo.

     L'icona segue da sola: negli <svg> il fill e' currentColor. */
  #btn-avanti {
    color: var(--arancio);
    border-color: var(--arancio-bordo);
  }
  /* Bianco su fondo trasparente: RIPETI e' la via laterale, e con AVANTI
     arancione accanto la gerarchia si legge senza dargli un bordo. */
  #btn-ripeti {
    color: #FAF8F3;
    background: transparent;
  }
  #btn-ripeti:hover { color: #FFFFFF; }

  /* Le due icone stanno entrambe nel markup e si alternano: cambiare il path
     via JS vorrebbe dire tenere due stringhe di path dentro il modulo. */
  #btn-avanti .ico-check,
  #btn-avanti[data-ico="check"] .ico-avanti { display: none; }
  #btn-avanti[data-ico="check"] .ico-check { display: block; }

  /* ---------- i tasti spenti, durante il tutorial ----------
     Alla prima apertura non c'e' ancora un disegno, quindi annulla, rifai e
     SALVA sono disabilitati e quasi invisibili: quattro passi su sette
     evidenziavano un'area in cui non si vedeva niente.

     Qui si cambia SOLO l'aspetto: l'attributo disabled resta, e i tasti
     restano inerti — e comunque il velo intercetta i tocchi. Il cestino non
     e' mai disabled ma sta a --dim, che sotto il velo e' altrettanto illeggibile:
     durante il tutorial sale anche lui, e si perde per qualche secondo la sua
     gerarchia piu' bassa. E' il minore dei due mali. */
  body[data-tutorial] .cmd:disabled,
  body[data-tutorial] #btn-clear { color: var(--ink); }
  body[data-tutorial] .btn:disabled {
    color: #FAF8F3;
    border-color: var(--btn-border);
  }

  /* ---------- taratura (solo con ?debug=1) ---------- */

  #debug[hidden] { display: none; }
  #debug {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 8px 12px;
    border-top: 1px solid var(--rule);
    font-size: 12px;
  }
  #debug button {
    font: inherit;
    font-weight: 700;
    color: var(--ink);
    background: var(--board);
    border: 1px solid var(--rule);
    border-radius: 4px;
    padding: 8px 12px;
    min-height: 38px;
    cursor: pointer;
  }
  #debug button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--page); }
  #debug .glab {
    font-size: 9px; font-weight: 700; letter-spacing: 0.11em;
    text-transform: uppercase; color: var(--dim); margin-right: 2px;
  }

  #hud {
    position: fixed;
    top: calc(env(safe-area-inset-top) + 10px);
    right: calc(env(safe-area-inset-right) + 10px);
    margin: 0;
    padding: 9px 11px;
    background: rgba(10, 12, 14, 0.86);
    border: 1px solid var(--rule);
    border-radius: 4px;
    color: var(--ink);
    font: 400 11px/1.55 ui-monospace, 'Cascadia Mono', Consolas, monospace;
    white-space: pre;
    pointer-events: none;                 /* non deve mai rubare il tocco */
  }
</style>
</head>
<body>

<div class="app">

  <div id="stage">
    <div class="layers" id="layers">
      <canvas id="base"></canvas>
      <canvas id="overlay"></canvas>
    </div>

    <button type="button" id="btn-back">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M14 20H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h8"/>
        <path d="M10 12h11"/><path d="M14 8l-4 4 4 4"/>
      </svg>
      <span>Torna al sito</span>
    </button>
  </div>

  <div class="ledge">

    <div id="widths" role="group" aria-label="Spessore"></div>

    <div class="tools">
      <div id="chalks" role="group" aria-label="Gessetto"></div>
      <button type="button" class="eraser" id="tool-eraser" aria-pressed="false" aria-label="Cancellino">
        <span class="felt"></span>
      </button>
    </div>

    <div class="cmds">
      <button type="button" class="cmd" id="btn-help" aria-label="Come funziona">?</button>
      <button type="button" class="cmd" id="btn-undo" aria-label="Annulla" disabled>
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 8h11a5 5 0 0 1 0 10H8"/><path d="M7 4L3 8l4 4"/>
        </svg>
      </button>
      <button type="button" class="cmd" id="btn-redo" aria-label="Rifai" disabled>
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 8H10a5 5 0 0 0 0 10h6"/><path d="M17 4l4 4-4 4"/>
        </svg>
      </button>
      <button type="button" class="cmd" id="btn-clear" aria-label="Cancella tutto">
        <svg width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 7h16"/><path d="M9 7V5h6v2"/>
          <path d="M6 7l1 13h10l1-13"/><path d="M10 11v6"/><path d="M14 11v6"/>
        </svg>
      </button>
    </div>

    <button type="button" id="btn-save" class="btn primario" aria-label="Salva e condividi il disegno" disabled>
      <span>SALVA</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 3L10.5 13.5"/><path d="M21 3l-6.8 18-3.7-7.5L3 9.8z"/>
      </svg>
    </button>

  </div>

  <!-- Taratura di Fase 2/3: fuori dalla UI, si accende con ?debug=1 -->
  <div id="debug" hidden>
    <span class="glab">Smoothing</span>
    <div class="seg" id="seg-smooth" role="group" aria-label="Livello di smoothing" style="display:flex;gap:2px">
      <button type="button" data-smooth="molto" aria-pressed="true">Molto</button>
      <button type="button" data-smooth="medio">Medio</button>
      <button type="button" data-smooth="poco">Poco</button>
    </div>
    <button type="button" id="btn-hud" aria-pressed="false" style="margin-left:auto">Info</button>
  </div>

</div>

<!-- Il tutorial. Sopra tutto, e intercetta i tocchi: mentre e' aperto non si
     disegna e non si toccano gli strumenti. Le frecce sono i path di
     "arrow-right" e "check" di Font Awesome 6 Solid, messi inline: l'icona e'
     una, e tirarsi dietro la libreria vorrebbe dire una richiesta esterna e
     ~100 KB. Dentro WordPress Font Awesome c'e' gia'. -->
<div id="tut" hidden>
  <div id="spot">
    <!-- width/height come ATTRIBUTI, non in CSS: le geometry properties di
         SVG2 sono recenti, un attributo in percentuale lo capiscono tutti. -->
    <svg id="spot-line" aria-hidden="true"><rect width="100%" height="100%"/></svg>
  </div>
  <div id="panel" role="dialog" aria-modal="true" aria-labelledby="step-t">
    <p id="step-n"></p>
    <p id="step-t"></p>
    <div class="row">
      <button type="button" id="btn-avanti" class="btn primario" data-ico="avanti">
        <span>AVANTI</span>
        <svg class="ico-avanti" viewBox="0 0 448 512" fill="currentColor" aria-hidden="true">
          <path d="M438.6 278.6c12.5-12.5 12.5-32.8 0-45.3l-160-160c-12.5-12.5-32.8-12.5-45.3 0s-12.5 32.8 0 45.3L338.8 224 32 224c-17.7 0-32 14.3-32 32s14.3 32 32 32l306.7 0L233.4 393.4c-12.5 12.5-12.5 32.8 0 45.3s32.8 12.5 45.3 0l160-160z"/>
        </svg>
        <svg class="ico-check" viewBox="0 0 448 512" fill="currentColor" aria-hidden="true">
          <path d="M438.6 105.4c12.5 12.5 12.5 32.8 0 45.3l-256 256c-12.5 12.5-32.8 12.5-45.3 0l-128-128c-12.5-12.5-12.5-32.8 0-45.3s32.8-12.5 45.3 0L160 338.7 393.4 105.4c12.5-12.5 32.8-12.5 45.3 0z"/>
        </svg>
      </button>
      <button type="button" id="btn-ripeti" class="btn secondario" hidden>RIPETI</button>
    </div>
  </div>
</div>

<pre id="hud" hidden></pre>

<script type="module" src="./src/main.js"></script>
</body>
</html>
