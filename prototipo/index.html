<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<!-- viewport-fit=cover serve al notch; user-scalable=no toglie il doppio-tap
     zoom, che su un'app di disegno e' un incidente, non una funzione. -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Lavagna — Fase 3</title>
<style>
  :root {
    --page:  #15171A;
    --panel: #1F2225;
    --ink:   #C8CCD0;
    --dim:   #71777C;
    --rule:  #2A2E32;
  }

  /* La pagina non deve poter scorrere in nessun modo: e' il difetto numero
     uno di un canvas a tutto schermo su mobile. position:fixed lo garantisce
     anche dove overscroll-behavior non basta (iOS < 16). */
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    position: fixed;
    overflow: hidden;
    overscroll-behavior: none;
    background: var(--page);
  }

  body {
    color: var(--ink);
    font: 500 12px/1.4 ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;          /* niente menu da long press */
    -webkit-tap-highlight-color: transparent;
  }

  .app {
    display: flex;
    flex-direction: column;
    height: 100dvh;
    padding:
      env(safe-area-inset-top) env(safe-area-inset-right)
      env(safe-area-inset-bottom) env(safe-area-inset-left);
    box-sizing: border-box;
  }

  #stage {
    flex: 1;
    min-height: 0;                        /* senza questo il flex non si stringe */
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 10px;
  }

  /* I due canvas sono sovrapposti: il tratto in corso sta sopra i tratti
     conclusi, e viene sostituito da quello definitivo quando si alza il dito. */
  /* Il colore della lavagna sta qui, non sul canvas: il cancellino lavora in
     destination-out e cancellerebbe anche il fondo se fosse dipinto insieme
     ai tratti. */
  .layers {
    position: relative;
    background: #1F2225;
    border-radius: 3px;
    overflow: hidden;
  }
  .layers canvas { display: block; }
  #overlay {
    position: absolute;
    inset: 0;
    /* Il pezzo piu' importante del file: senza, disegnare = scrollare. */
    touch-action: none;
    cursor: crosshair;
  }

  .bar {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 9px 12px;
    border-top: 1px solid var(--rule);
    flex-wrap: wrap;
  }

  .bar .title {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.13em;
    text-transform: uppercase;
    color: var(--dim);
    margin-right: auto;
  }

  button {
    font: inherit;
    font-weight: 600;
    color: var(--ink);
    background: var(--panel);
    border: 1px solid var(--rule);
    border-radius: 4px;
    padding: 9px 14px;
    min-height: 40px;
    cursor: pointer;
    touch-action: manipulation;
  }
  button:hover:not(:disabled) { border-color: #3A4046; }
  button:disabled { opacity: 0.35; cursor: default; }
  button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--page); }
  button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

  /* Controllo di taratura: serve alla Fase 2 per scegliere beta sul device.
     Va via con la UI definitiva della Fase 4. */
  .glab {
    font-size: 9px; font-weight: 700; letter-spacing: 0.11em;
    text-transform: uppercase; color: var(--dim); margin-right: 2px;
  }
  .seg { display: flex; gap: 2px; }
  .seg button { padding: 9px 10px; }

  /* Pastiglie di colore: strumento di Fase 3 per giudicare la texture su
     tutta la palette. La UI vera, con i gessetti, e' Fase 4. */
  #seg-color { gap: 4px; }
  #seg-color button {
    width: 30px; min-height: 30px; padding: 0;
    border-radius: 50%; border: 1px solid transparent;
  }
  #seg-color button[aria-pressed="true"] { border-color: var(--ink); }

  #hud {
    position: fixed;
    top: calc(env(safe-area-inset-top) + 10px);
    right: calc(env(safe-area-inset-right) + 10px);
    margin: 0;
    padding: 9px 11px;
    background: rgba(10, 12, 14, 0.86);
    border: 1px solid var(--rule);
    border-radius: 4px;
    color: var(--ink);
    font: 400 11px/1.55 ui-monospace, 'Cascadia Mono', Consolas, monospace;
    white-space: pre;
    pointer-events: none;                 /* non deve mai rubare il tocco */
  }
</style>
</head>
<body>

<div class="app">
  <div id="stage">
    <div class="layers" id="layers">
      <canvas id="base"></canvas>
      <canvas id="overlay"></canvas>
    </div>
  </div>
  <div class="bar">
    <span class="title">Lavagna · Fase 3</span>
    <div class="seg" id="seg-tool" role="group" aria-label="Strumento">
      <button type="button" data-tool="chalk" aria-pressed="true">Gesso</button>
      <button type="button" data-tool="eraser">Gomma</button>
    </div>
    <div class="seg" id="seg-color" role="group" aria-label="Colore"></div>
    <span class="glab">Smoothing</span>
    <div class="seg" id="seg-smooth" role="group" aria-label="Livello di smoothing">
      <button type="button" data-smooth="molto" aria-pressed="true">Molto</button>
      <button type="button" data-smooth="medio">Medio</button>
      <button type="button" data-smooth="poco">Poco</button>
    </div>
    <button type="button" id="btn-undo" disabled>Annulla</button>
    <button type="button" id="btn-redo" disabled>Rifai</button>
    <button type="button" id="btn-hud" aria-pressed="false">Info</button>
    <button type="button" id="btn-clear">Pulisci</button>
  </div>
</div>

<pre id="hud" hidden></pre>

<script type="module" src="./src/main.js"></script>
</body>
</html>
