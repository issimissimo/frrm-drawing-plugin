<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
  <style>
    body { margin: 0; font-family: 'Atkinson Hyperlegible', ui-sans-serif, system-ui, sans-serif; }
    a { color: #71777C; text-decoration: none; }
    a:hover { color: #C8CCD0; }
    * { box-sizing: border-box; }
    .lift { transition: transform .16s cubic-bezier(.2,.9,.3,1), opacity .16s; }
    .cmd:hover { color: #FAF8F3; }
  </style>
</helmet>

<div style="width: 1440px; height: 900px; display: flex; flex-direction: column; background: #1F2225; color: #C8CCD0; overflow: hidden;">

  <div style="flex: 1; min-height: 0; position: relative;">

    <sc-if value="{{ sample }}" hint-placeholder-val="{{ true }}">
      <svg viewBox="0 0 1440 750" width="1440" height="750" style="position: absolute; inset: 0; display: block;">
        <defs>
          <filter id="gesso" x="-15%" y="-15%" width="130%" height="130%">
            <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="7" result="n"></feTurbulence>
            <feDisplacementMap in="SourceGraphic" in2="n" scale="5" xChannelSelector="R" yChannelSelector="G"></feDisplacementMap>
          </filter>
        </defs>
        <g filter="url(#gesso)" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.86">
          <circle cx="1180" cy="150" r="62" stroke="#C9B957" stroke-width="9"></circle>
          <g stroke="#C9B957" stroke-width="8">
            <path d="M1180 48 L1180 14"></path><path d="M1180 286 L1180 252"></path>
            <path d="M1078 150 L1044 150"></path><path d="M1316 150 L1282 150"></path>
            <path d="M1108 78 L1084 54"></path><path d="M1276 222 L1252 198"></path>
            <path d="M1252 78 L1276 54"></path><path d="M1084 246 L1108 222"></path>
          </g>
          <path d="M232 168 q-30 -46 22 -60 q10 -46 62 -34 q30 -44 78 -10 q56 -12 52 46 q42 14 20 58 z" stroke="#71BFFF" stroke-width="8"></path>
          <path d="M566 404 L566 622 L822 622 L822 404" stroke="#FAF8F3" stroke-width="10"></path>
          <path d="M540 406 L694 292 L848 406" stroke="#FB9795" stroke-width="11"></path>
          <path d="M660 622 L660 520 L730 520 L730 622" stroke="#F197C2" stroke-width="9"></path>
          <circle cx="770" cy="470" r="26" stroke="#3BCFCF" stroke-width="8"></circle>
          <path d="M40 656 Q380 630 740 660 T1400 642" stroke="#85CC87" stroke-width="11"></path>
          <g stroke="#85CC87" stroke-width="7">
            <path d="M150 650 l-14 -34"></path><path d="M186 648 l10 -38"></path>
            <path d="M960 664 l-12 -32"></path><path d="M1004 662 l14 -34"></path>
            <path d="M1190 652 l-10 -30"></path>
          </g>
          <path d="M120 372 q56 -70 104 -8 q46 60 100 -12 q42 -56 84 6" stroke="#C9A3F5" stroke-width="10"></path>
          <path d="M1050 660 L1050 570" stroke="#85CC87" stroke-width="8"></path>
          <circle cx="1050" cy="546" r="24" stroke="#F1A366" stroke-width="9"></circle>
        </g>
      </svg>
    </sc-if>

    <a href="#" style="position: absolute; top: 18px; left: 22px; display: flex; align-items: center; gap: 9px; height: 44px; padding: 0 14px 0 10px; font-size: 14px;">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14 20H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h8"></path>
        <path d="M10 12h11"></path><path d="M14 8l-4 4 4 4"></path>
      </svg>
      <span>Torna al sito</span>
    </a>
  </div>

  <div style="height: 152px; background: #15171A; display: flex; align-items: flex-end; padding: 0 40px 26px;">

    <div style="height: 94px; display: flex; align-items: center; gap: 12px; margin-right: 54px;">
      <sc-for list="{{ widths }}" as="w" hint-placeholder-count="3">
        <div onClick="{{ w.pick }}" class="lift" style="{{ w.style }}"></div>
      </sc-for>
    </div>

    <div style="display: flex; align-items: flex-end; gap: 6px;">
      <sc-for list="{{ chalks }}" as="c" hint-placeholder-count="9">
        <div onClick="{{ c.pick }}" style="width: 34px; height: 118px; display: flex; align-items: flex-end; justify-content: center; cursor: pointer;">
          <div class="lift" style="{{ c.style }}"></div>
        </div>
      </sc-for>
    </div>

    <div onClick="{{ pickEraser }}" style="width: 74px; height: 118px; display: flex; align-items: flex-end; justify-content: center; cursor: pointer; margin-left: 30px;">
      <div class="lift" style="{{ eraserStyle }}">
        <div style="height: 15px; background: #4A4038;"></div>
      </div>
    </div>

    <div style="margin-left: auto; height: 94px; display: flex; align-items: center; gap: 4px;">
      <div onClick="{{ undo }}" class="cmd" style="{{ undoStyle }}">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 8h11a5 5 0 0 1 0 10H8"></path><path d="M7 4L3 8l4 4"></path>
        </svg>
      </div>
      <div onClick="{{ redo }}" class="cmd" style="{{ redoStyle }}">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 8H10a5 5 0 0 0 0 10h6"></path><path d="M17 4l4 4-4 4"></path>
        </svg>
      </div>
      <div onClick="{{ clear }}" class="cmd" style="width: 46px; height: 46px; display: flex; align-items: center; justify-content: center; color: #71777C; cursor: pointer; margin-left: 22px;">
        <svg width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 7h16"></path><path d="M9 7V5h6v2"></path>
          <path d="M6 7l1 13h10l1-13"></path><path d="M10 11v6"></path><path d="M14 11v6"></path>
        </svg>
      </div>
    </div>

    <div style="height: 94px; display: flex; align-items: center; margin-left: 30px;">
      <div style="display: flex; align-items: center; gap: 11px; height: 54px; padding: 0 26px; border-radius: 27px; background: #23272B; color: #565C61; font-size: 16px; font-weight: 700; letter-spacing: 0.04em; cursor: default;">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 3L10.5 13.5"></path><path d="M21 3l-6.8 18-3.7-7.5L3 9.8z"></path>
        </svg>
        <span>INVIA</span>
      </div>
    </div>

  </div>
</div>
</x-dc>

<script data-dc-script data-props='{"sample":{"editor":"boolean","default":true},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { chalk: 'rosa', width: 'medio', tool: 'chalk', canRedo: false };
  }

  mix(hex, target, t) {
    const p = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
    const a = p(hex), b = p(target);
    return '#' + a.map((v, i) => Math.round(v + (b[i] - v) * t).toString(16).padStart(2, '0')).join('');
  }

  renderVals() {
    const s = this.state || {};
    const tool = s.tool || 'chalk';
    const CHALKS = [
      ['bianco', '#FAF8F3'], ['giallo', '#C9B957'], ['arancio', '#F1A366'],
      ['corallo', '#FB9795'], ['rosa', '#F197C2'], ['lilla', '#C9A3F5'],
      ['azzurro', '#71BFFF'], ['acqua', '#3BCFCF'], ['verde', '#85CC87']
    ];
    const curHex = (CHALKS.find(function (c) { return c[0] === s.chalk; }) || CHALKS[0])[1];
    const self = this;

    const chalks = CHALKS.map(function (pair) {
      const id = pair[0], hex = pair[1];
      const on = tool === 'chalk' && s.chalk === id;
      const light = self.mix(hex, '#FFFFFF', 0.30);
      const dark = self.mix(hex, '#000000', 0.38);
      return {
        id: id,
        pick: function () { self.setState({ chalk: id, tool: 'chalk' }); },
        style: 'width: 30px; height: 94px; border-radius: 7px 7px 3px 3px;'
          + 'background: linear-gradient(96deg, ' + dark + ' 0%, ' + hex + ' 26%, ' + light + ' 48%, ' + hex + ' 74%, ' + dark + ' 100%);'
          + 'transform: translateY(' + (on ? '-24px' : '0px') + ');'
          + 'box-shadow: ' + (on ? '0 16px 22px -12px rgba(0,0,0,.85), 0 0 26px -4px ' + hex + '55' : 'none') + ';'
          + 'opacity: ' + (on || tool !== 'chalk' ? '1' : '0.72') + ';'
      };
    });

    const WIDTHS = [['sottile', 5], ['medio', 10], ['grosso', 19]];
    const widths = WIDTHS.map(function (pair) {
      const id = pair[0], h = pair[1];
      const on = s.width === id;
      return {
        id: id,
        pick: function () { self.setState({ width: id }); },
        style: 'width: 50px; height: ' + h + 'px; border-radius: ' + (h / 2) + 'px;'
          + 'background: ' + curHex + '; cursor: pointer;'
          + 'opacity: ' + (on ? '1' : '0.28') + ';'
          + 'transform: translateY(' + (on ? '-9px' : '0px') + ');'
      };
    });

    const erOn = tool === 'eraser';
    return {
      sample: this.props.sample === undefined ? true : this.props.sample,
      chalks: chalks,
      widths: widths,
      pickEraser: function () { self.setState({ tool: 'eraser' }); },
      eraserStyle: 'width: 68px; height: 54px; border-radius: 6px; overflow: hidden;'
        + 'background: linear-gradient(96deg, #2C3136 0%, #4B5258 40%, #3A4046 100%);'
        + 'transform: translateY(' + (erOn ? '-24px' : '0px') + ');'
        + 'box-shadow: ' + (erOn ? '0 16px 22px -12px rgba(0,0,0,.85), 0 0 26px -6px #8A939944' : 'none') + ';'
        + 'opacity: ' + (erOn ? '1' : '0.72') + ';',
      undo: function () { self.setState({ canRedo: true }); },
      redo: function () { self.setState({ canRedo: false }); },
      clear: function () {},
      undoStyle: 'width: 46px; height: 46px; display: flex; align-items: center; justify-content: center; color: #C8CCD0; cursor: pointer;',
      redoStyle: 'width: 46px; height: 46px; display: flex; align-items: center; justify-content: center; cursor: pointer;'
        + 'color: ' + (s.canRedo ? '#C8CCD0' : '#3C4247') + ';'
    };
  }
}
</script>
</body>
</html>
