<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
  <style>
    body { margin: 0; font-family: 'Atkinson Hyperlegible', ui-sans-serif, system-ui, sans-serif; }
    a { color: #71777C; text-decoration: none; }
    a:hover { color: #C8CCD0; }
    * { box-sizing: border-box; }
    .lift { transition: transform .16s cubic-bezier(.2,.9,.3,1), opacity .16s; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: #1F2225; color: #C8CCD0; overflow: hidden;">

  <div style="flex: 1; min-height: 0; position: relative;">

    <sc-if value="{{ sample }}" hint-placeholder-val="{{ true }}">
      <svg viewBox="0 0 390 686" width="390" height="686" style="position: absolute; inset: 0; display: block;">
        <defs>
          <filter id="gessoM" x="-15%" y="-15%" width="130%" height="130%">
            <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="4" result="n"></feTurbulence>
            <feDisplacementMap in="SourceGraphic" in2="n" scale="3" xChannelSelector="R" yChannelSelector="G"></feDisplacementMap>
          </filter>
        </defs>
        <g filter="url(#gessoM)" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.86">
          <circle cx="304" cy="118" r="34" stroke="#C9B957" stroke-width="6"></circle>
          <g stroke="#C9B957" stroke-width="5">
            <path d="M304 62 L304 42"></path><path d="M248 118 L228 118"></path>
            <path d="M264 78 L250 64"></path><path d="M344 78 L358 64"></path>
            <path d="M264 158 L250 172"></path>
          </g>
          <path d="M62 128 q-20 -30 14 -40 q7 -30 41 -22 q20 -29 52 -7 q37 -8 34 30 q28 9 13 39 z" stroke="#71BFFF" stroke-width="5"></path>
          <path d="M96 356 L96 508 L274 508 L274 356" stroke="#FAF8F3" stroke-width="7"></path>
          <path d="M78 358 L185 278 L292 358" stroke="#FB9795" stroke-width="8"></path>
          <path d="M162 508 L162 436 L211 436 L211 508" stroke="#F197C2" stroke-width="6"></path>
          <circle cx="238" cy="404" r="18" stroke="#3BCFCF" stroke-width="6"></circle>
          <path d="M14 540 Q120 522 214 546 T384 532" stroke="#85CC87" stroke-width="8"></path>
          <g stroke="#85CC87" stroke-width="5">
            <path d="M58 536 l-9 -24"></path><path d="M84 534 l7 -26"></path>
            <path d="M290 542 l-8 -22"></path><path d="M322 540 l10 -24"></path>
          </g>
          <path d="M36 236 q38 -48 70 -6 q31 41 68 -8" stroke="#C9A3F5" stroke-width="7"></path>
          <path d="M330 540 L330 476" stroke="#85CC87" stroke-width="5"></path>
          <circle cx="330" cy="460" r="16" stroke="#F1A366" stroke-width="6"></circle>
        </g>
      </svg>
    </sc-if>

    <a href="#" style="position: absolute; top: 10px; left: 8px; display: flex; align-items: center; gap: 7px; height: 44px; padding: 0 12px; font-size: 13px;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14 20H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h8"></path>
        <path d="M10 12h11"></path><path d="M14 8l-4 4 4 4"></path>
      </svg>
      <span>Torna al sito</span>
    </a>
  </div>

  <div style="background: #15171A; padding: 8px 14px 20px;">

    <div style="display: flex; align-items: flex-end; gap: 2px;">
      <sc-for list="{{ chalks }}" as="c" hint-placeholder-count="9">
        <div onClick="{{ c.pick }}" style="width: 32px; height: 84px; display: flex; align-items: flex-end; justify-content: center; cursor: pointer;">
          <div class="lift" style="{{ c.style }}"></div>
        </div>
      </sc-for>
      <div onClick="{{ pickEraser }}" style="width: 42px; height: 84px; display: flex; align-items: flex-end; justify-content: center; cursor: pointer; margin-left: 8px;">
        <div class="lift" style="{{ eraserStyle }}">
          <div style="height: 10px; background: #4A4038;"></div>
        </div>
      </div>
    </div>

    <div style="display: flex; align-items: center; height: 56px; margin-top: 4px;">
      <div style="display: flex; align-items: center; gap: 9px;">
        <sc-for list="{{ widths }}" as="w" hint-placeholder-count="3">
          <div onClick="{{ w.pick }}" class="lift" style="{{ w.style }}"></div>
        </sc-for>
      </div>

      <div style="margin-left: auto; display: flex; align-items: center; gap: 0;">
        <div onClick="{{ undo }}" style="{{ undoStyle }}">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 8h11a5 5 0 0 1 0 10H8"></path><path d="M7 4L3 8l4 4"></path>
          </svg>
        </div>
        <div onClick="{{ redo }}" style="{{ redoStyle }}">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 8H10a5 5 0 0 0 0 10h6"></path><path d="M17 4l4 4-4 4"></path>
          </svg>
        </div>
        <div onClick="{{ clear }}" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #71777C; cursor: pointer; margin-left: 6px;">
          <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 7h16"></path><path d="M9 7V5h6v2"></path>
            <path d="M6 7l1 13h10l1-13"></path><path d="M10 11v6"></path><path d="M14 11v6"></path>
          </svg>
        </div>
      </div>

      <div style="margin-left: 14px; display: flex; align-items: center; gap: 8px; height: 46px; padding: 0 18px; border-radius: 23px; background: #23272B; color: #565C61; font-size: 14px; font-weight: 700; letter-spacing: 0.04em; cursor: default;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 3L10.5 13.5"></path><path d="M21 3l-6.8 18-3.7-7.5L3 9.8z"></path>
        </svg>
        <span>INVIA</span>
      </div>
    </div>

  </div>
</div>
</x-dc>

<script data-dc-script data-props='{"sample":{"editor":"boolean","default":true},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { chalk: 'acqua', width: 'medio', tool: 'chalk', canRedo: false };
  }

  mix(hex, target, t) {
    const p = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
    const a = p(hex), b = p(target);
    return '#' + a.map((v, i) => Math.round(v + (b[i] - v) * t).toString(16).padStart(2, '0')).join('');
  }

  renderVals() {
    const s = this.state || {};
    const tool = s.tool || 'chalk';
    const CHALKS = [
      ['bianco', '#FAF8F3'], ['giallo', '#C9B957'], ['arancio', '#F1A366'],
      ['corallo', '#FB9795'], ['rosa', '#F197C2'], ['lilla', '#C9A3F5'],
      ['azzurro', '#71BFFF'], ['acqua', '#3BCFCF'], ['verde', '#85CC87']
    ];
    const curHex = (CHALKS.find(function (c) { return c[0] === s.chalk; }) || CHALKS[0])[1];
    const self = this;

    const chalks = CHALKS.map(function (pair) {
      const id = pair[0], hex = pair[1];
      const on = tool === 'chalk' && s.chalk === id;
      const light = self.mix(hex, '#FFFFFF', 0.30);
      const dark = self.mix(hex, '#000000', 0.38);
      return {
        id: id,
        pick: function () { self.setState({ chalk: id, tool: 'chalk' }); },
        style: 'width: 22px; height: 64px; border-radius: 5px 5px 2px 2px;'
          + 'background: linear-gradient(96deg, ' + dark + ' 0%, ' + hex + ' 26%, ' + light + ' 48%, ' + hex + ' 74%, ' + dark + ' 100%);'
          + 'transform: translateY(' + (on ? '-18px' : '0px') + ');'
          + 'box-shadow: ' + (on ? '0 12px 16px -9px rgba(0,0,0,.85), 0 0 20px -3px ' + hex + '55' : 'none') + ';'
          + 'opacity: ' + (on || tool !== 'chalk' ? '1' : '0.72') + ';'
      };
    });

    const WIDTHS = [['sottile', 4], ['medio', 8], ['grosso', 15]];
    const widths = WIDTHS.map(function (pair) {
      const id = pair[0], h = pair[1];
      const on = s.width === id;
      return {
        id: id,
        pick: function () { self.setState({ width: id }); },
        style: 'width: 32px; height: ' + h + 'px; border-radius: ' + (h / 2) + 'px;'
          + 'background: ' + curHex + '; cursor: pointer;'
          + 'opacity: ' + (on ? '1' : '0.28') + ';'
          + 'transform: translateY(' + (on ? '-6px' : '0px') + ');'
      };
    });

    const erOn = tool === 'eraser';
    return {
      sample: this.props.sample === undefined ? true : this.props.sample,
      chalks: chalks,
      widths: widths,
      pickEraser: function () { self.setState({ tool: 'eraser' }); },
      eraserStyle: 'width: 38px; height: 36px; border-radius: 5px; overflow: hidden;'
        + 'background: linear-gradient(96deg, #2C3136 0%, #4B5258 40%, #3A4046 100%);'
        + 'transform: translateY(' + (erOn ? '-18px' : '0px') + ');'
        + 'box-shadow: ' + (erOn ? '0 12px 16px -9px rgba(0,0,0,.85), 0 0 20px -4px #8A939944' : 'none') + ';'
        + 'opacity: ' + (erOn ? '1' : '0.72') + ';',
      undo: function () { self.setState({ canRedo: true }); },
      redo: function () { self.setState({ canRedo: false }); },
      clear: function () {},
      undoStyle: 'width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #C8CCD0; cursor: pointer;',
      redoStyle: 'width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; cursor: pointer;'
        + 'color: ' + (s.canRedo ? '#C8CCD0' : '#3C4247') + ';'
    };
  }
}
</script>
</body>
</html>
